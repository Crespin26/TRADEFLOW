name: tradeflow_mobile
description: Mobile inventory, orders and international trade management.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  cupertino_icons: ^1.0.9
  file_selector: ^1.1.0
  image: ^4.12.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/catalog/
    - assets/fonts/
